[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reach-mcp"
version = "0.2.3"
description = "PC control for ChatGPT and Claude chats."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Reach MCP contributors"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
]
dependencies = [
    "mcp>=2.3,<3",
    "mss>=10",
    "pillow>=11",
    "uvicorn>=0.30",
]

[project.urls]
Repository = "https://github.com/whyaaronbailey/reach-mcp"
Issues = "https://github.com/whyaaronbailey/reach-mcp/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2"]

[project.scripts]
reach-mcp = "reach_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
reach_mcp = ["control_panel.html"]
