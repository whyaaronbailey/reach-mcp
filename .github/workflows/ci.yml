name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Install native environment
        run: python -m pip install -e ".[dev]"
      - name: Native unit tests
        run: python -m pytest -q
      - name: Build distributions
        run: python -m build
      - name: Install isolated relay environment
        shell: pwsh
        run: |
          python -m venv web/.venv
          web/.venv/Scripts/python -m pip install -r web/requirements.txt
      - name: Owner authorization tests
        run: web/.venv/Scripts/python web/test_owner.py -q
      - name: Approval error proxy tests
        run: web/.venv/Scripts/python web/test_approval_errors.py -q
